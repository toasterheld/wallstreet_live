<!DOCTYPE html><html lang="de" class="sm"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · CodeClub Börse</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<nav class="nav"><b>🎛️ ADMIN</b><a href="../presenter/" target="_blank">📺 Presenter</a><a href="../terminal/" target="_blank">📱 Terminal</a>
 <button id="snd" class="b-g">🔊 Sound Effekte: AN</button><button id="sndt">🔔 Test</button><span class="mut" id="snh"></span><span class="mut cn"></span></nav>
<section class="adm">
 <div class="card"><h2>A · Börsenschalter</h2>
  <div class="row"><select id="tt"></select><select id="tp"></select></div>
  <div class="row"><input id="tq" type="number" min="1" value="1" aria-label="Menge"><button id="buy" class="b-g">📈 Kauf</button><button id="sell" class="b-r">📉 Verkauf</button></div>
  <div id="fb" class="mut" aria-live="polite">&nbsp;</div><table id="ap"></table><div class="log" id="lg"></div></div>
 <div class="card"><h2>📊 Beamer-Chart</h2><button id="ar"></button><div class="seg" id="cb"></div></div>
 <div class="card"><h2>Spielzeit</h2><div class="lvl" id="agt">00:00</div>
  <div class="row"><button id="gs" class="b-g">▶ Start</button><button id="gp" class="b-o">⏸ Pause</button><button id="gr">↺ Reset</button></div>
  <label class="mut">Dauer in Min (0 = hochzählen) <input id="tl" type="number" min="0"></label><button id="rst" class="b-r">⚠ Neue Spielrunde (alles zurücksetzen)</button></div>
 <div class="card full"><h2>C · Eilmeldungen &amp; Markt-Events <small class="mut">(jedes Event nur einmal pro Spielrunde)</small></h2>
  <div class="evg" id="evg"></div>
  <div id="ael"></div>
  <div class="row"><input id="ct" placeholder="Eigene Freitext-Eilmeldung …" maxlength="140"><button id="cust" class="b-c" style="flex:0 0 auto">📢 Senden</button><button id="clr" class="b-r" style="flex:0 0 auto">✖ Eilmeldung löschen</button></div>
  <div id="evm" class="mut" aria-live="polite">&nbsp;</div><div id="cur" class="mut"></div></div>
 <div class="card full"><h2>B · Teams: Name, Mitglieder, Status &amp; Level</h2><div id="at"></div></div>
 <div class="card"><h2>📜 Aktive Patente</h2><div id="pl"></div></div>
 <div class="card"><h2>📱 Aktive Terminals</h2><div id="tl2"></div></div>
</section>
<script src="../js/config.js"></script><script src="../js/core.js"></script><script src="../js/admin.js"></script></body></html>
